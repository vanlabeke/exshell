name: release

# Tag-driven. `git tag v1.2.3 && git push origin v1.2.3` produces the whole
# release: signed and notarized macOS universal binary, tarballs for
# linux/freebsd/openbsd/netbsd, .deb and .rpm, a Homebrew cask, and updated
# apt/yum repositories on pkg.vanlabeke.dev.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # macOS runner because codesign and notarytool only exist here. Everything
  # else cross-compiles from macOS fine — exshell is pure Go.
  #
  # Note: macOS runners bill at a 10x minute multiplier on private repos, and
  # are free on public ones.
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: GoReleaser derives the changelog from commits since
          # the previous tag, and a shallow clone silently produces an empty
          # changelog rather than failing.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral password for an ephemeral keychain on an ephemeral
          # runner; it never protects anything beyond this job.
          kcpass=$(uuidgen)
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$kcpass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kcpass" "$keychain"

          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign blocks on an interactive keychain-access
          # prompt that no one is there to answer, and the job hangs.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$keychain"

          # Put our keychain in the search list so codesign can find the
          # identity, keeping the login keychain for anything else.
          security list-keychain -d user -s "$keychain" login.keychain-db

          echo "Identities available:"
          security find-identity -v -p codesigning "$keychain"

      - name: Write signing credentials to disk
        env:
          AC_KEY_P8: ${{ secrets.AC_KEY_P8 }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # App Store Connect API key for notarytool. Preferred over an
          # app-specific password: it is scopable and revocable on its own.
          printf '%s' "$AC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/ac_key.p8"
          chmod 600 "$RUNNER_TEMP/ac_key.p8"
          echo "AC_KEY_PATH=$RUNNER_TEMP/ac_key.p8" >> "$GITHUB_ENV"

          # GPG private key for nfpm's package-level signatures. nfpm signs
          # via Go crypto and reads the key file directly, so no gpg binary
          # is needed on this runner.
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/signing.key"
          chmod 600 "$RUNNER_TEMP/signing.key"
          echo "GPG_KEY_FILE=$RUNNER_TEMP/signing.key" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate PAT: GITHUB_TOKEN is scoped to this repository and cannot
          # push to the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          AC_KEY_ID: ${{ secrets.AC_KEY_ID }}
          AC_ISSUER_ID: ${{ secrets.AC_ISSUER_ID }}
          # Passphrase for the nfpm signing key.
          NFPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify the shipped macOS binary is signed and notarized
        run: |
          set -euo pipefail
          bin=dist/darwin-universal_darwin_all/exshell
          lipo -info "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # The certificate must be Developer ID. An Apple Development
          # certificate signs happily and is then rejected by Gatekeeper on
          # every machine but the developer's own.
          if ! codesign -dv --verbose=4 "$bin" 2>&1 | grep -q "Authority=Developer ID Application:"; then
            echo "::error::binary is not signed with a Developer ID Application certificate"
            codesign -dv --verbose=4 "$bin" 2>&1 | grep '^Authority=' || true
            exit 1
          fi

          # The hardened runtime is a notarization prerequisite; without it
          # Apple rejects the submission.
          if ! codesign -dv --verbose=4 "$bin" 2>&1 | grep -q "flags=.*runtime"; then
            echo "::error::binary is not signed with the hardened runtime"
            exit 1
          fi

          # Notarization is NOT asserted here, deliberately. Neither available
          # local check works on a bare command-line binary:
          #
          #   spctl --assess --type execute
          #     assesses application bundles. On a plain Mach-O it returns
          #     "rejected (the code is valid but does not seem to be an app)"
          #     whether or not the binary is notarized — it is not a
          #     notarization check at all.
          #
          #   codesign --test-requirement="=notarized"
          #     looks for a *stapled* ticket. Stapling only works on .app,
          #     .dmg and .pkg containers, so a bare binary can never satisfy
          #     it, however successfully it was notarized.
          #
          # The ticket lives on Apple's servers and Gatekeeper fetches it
          # online, so the authoritative check is Apple's own verdict at
          # submission time. scripts/notarize.sh requires "status: Accepted"
          # and fails the build otherwise, which is what actually gates this.
          echo "Signature and hardened runtime verified."
          echo "Notarization was asserted at submission time by notarize.sh."

      # Hand the Linux packages to the next job rather than rebuilding them.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          retention-days: 7
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  # Regenerating repository metadata needs dpkg-scanpackages, apt-ftparchive
  # and createrepo_c, which are Debian-native — hence a Linux runner rather
  # than fighting Homebrew equivalents on macOS.
  publish-repos:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: packages

      - name: Check out the Pages repository
        uses: actions/checkout@v4
        with:
          repository: vanlabeke/packages
          token: ${{ secrets.PACKAGES_TOKEN }}
          path: pages

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev apt-utils createrepo-c gnupg

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          # Preset the passphrase so the batch signing below never prompts.
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "use-agent" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye
          keygrip=$(gpg --with-keygrip --list-secret-keys \
            | awk '/Keygrip/ { print $3; exit }')
          /usr/lib/gnupg2/gpg-preset-passphrase --preset \
            --passphrase "$GPG_PASSPHRASE" "$keygrip" \
            || /usr/lib/gnupg/gpg-preset-passphrase --preset \
                 --passphrase "$GPG_PASSPHRASE" "$keygrip"

      - name: Rebuild the apt and yum repositories
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: source/scripts/build-repos.sh "$PWD/packages" "$PWD/pages"

      - name: Commit and push
        working-directory: pages
        run: |
          set -euo pipefail
          git config user.name "goreleaser"
          git config user.email "noreply@vanlabeke.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "no repository changes"
            exit 0
          fi
          git commit -m "exshell ${GITHUB_REF_NAME}: refresh apt/yum metadata"
          git push
